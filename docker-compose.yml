services:
  mysql:
    image: mysql:8.0
    container_name: autoforward-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - autoforward-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DATABASE_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  autoforward:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoforward-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ./auth:/app/auth
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://${DATABASE_USER}:${DATABASE_PASSWORD}@mysql:3306/${DATABASE_NAME}
    depends_on:
      mysql:
        condition: service_healthy
    stdin_open: true
    tty: true
    networks:
      - autoforward-network

networks:
  autoforward-network:
    driver: bridge

volumes:
  mysql_data:
